name: 'mirror'
on:
  schedule:
    - cron: '0 3 * * 0'  # Runs at 3 AM UTC weekly (Sunday)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: mirror
        env:
          ORIGIN_URL: 'https://git.sr.ht/~foosoft/anki-connect'
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GH_PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git clone "$GH_PUSH_URL" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$ORIGIN_URL"
          git fetch upstream --tags
          DEFAULT_BRANCH="$(git remote show upstream | awk '/HEAD branch/ {print $NF}')"
          git checkout master
          git rebase "upstream/${DEFAULT_BRANCH}"
          git push --force-with-lease origin master
          git push --tags --force
